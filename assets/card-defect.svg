<svg xmlns="http://www.w3.org/2000/svg" width="580" height="240" viewBox="0 0 580 240" role="img" aria-label="Automotive Defect Detection">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f0c29"/><stop offset="0.6" stop-color="#1b1464"/><stop offset="1" stop-color="#24243e"/></linearGradient>
    <linearGradient id="rb" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="290" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#00f5ff"/><stop offset="0.33" stop-color="#7c3aed"/><stop offset="0.66" stop-color="#ff5ecb"/><stop offset="1" stop-color="#ffb347"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="580 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect x="3" y="3" width="574" height="234" rx="20" fill="url(#bg)"/>
  <rect x="3" y="3" width="574" height="234" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
  <rect x="3" y="3" width="574" height="234" rx="20" fill="none" stroke="url(#rb)" stroke-width="3.5" stroke-linecap="round" pathLength="1000" stroke-dasharray="220 780"><animate attributeName="stroke-dashoffset" from="0" to="-1000" dur="6s" repeatCount="indefinite"/></rect>
  <g><text x="62" y="92" text-anchor="middle" font-size="52">🏭</text><animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="3.4s" repeatCount="indefinite"/></g>
  <text x="112" y="70" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="25" font-weight="800" fill="#ffffff">Automotive Defect Detection</text>
  <text x="112" y="96" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="13" fill="#00f5ff">Computer Vision · Stellantis, Thiruvallur</text>
  <text x="34" y="144" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="16" fill="#cbd5e1">AI inspection with YOLOv8 and HSV</text>
  <text x="34" y="168" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="16" fill="#cbd5e1">colour-space defect detection.</text>
  <g><rect x="34" y="186" width="75" height="28" rx="14" fill="#00f5ff" fill-opacity="0.18" stroke="#00f5ff" stroke-width="1.5"/><text x="71.5" y="205" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#ffffff">YOLOv8</text><animate attributeName="opacity" values="0.8;1;0.8" dur="2.5s" repeatCount="indefinite"/></g>
    <g><rect x="119" y="186" width="75" height="28" rx="14" fill="#8b5cf6" fill-opacity="0.18" stroke="#8b5cf6" stroke-width="1.5"/><text x="156.5" y="205" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#ffffff">OpenCV</text><animate attributeName="opacity" values="0.8;1;0.8" dur="3.0s" repeatCount="indefinite"/></g>
    <g><rect x="204" y="186" width="75" height="28" rx="14" fill="#3776AB" fill-opacity="0.18" stroke="#3776AB" stroke-width="1.5"/><text x="241.5" y="205" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#ffffff">Python</text><animate attributeName="opacity" values="0.8;1;0.8" dur="3.5s" repeatCount="indefinite"/></g>
    
  <g transform="translate(428 18)">
    <rect width="132" height="26" rx="13" fill="#ff5ecb" fill-opacity="0.2" stroke="#ff5ecb" stroke-width="1.5"/>
    <circle cx="14" cy="13" r="4" fill="#ff5ecb"><animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/></circle>
    <text x="75.0" y="18" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="11.5" font-weight="800" fill="#ffffff" letter-spacing="1">INTERNSHIP</text>
  </g>
</svg>
