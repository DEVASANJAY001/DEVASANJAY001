<svg xmlns="http://www.w3.org/2000/svg" width="240" height="64" viewBox="0 0 240 64" role="img" aria-label="Portfolio">
  <defs>
    <clipPath id="cp"><rect x="4" y="6" width="232" height="48" rx="24"/></clipPath>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#0f0c29"/></linearGradient>
  </defs>
  <g>
    <rect x="4" y="6" width="232" height="48" rx="24" fill="url(#g)"/>
    <rect x="4" y="6" width="232" height="48" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2"><animate attributeName="stroke-opacity" values="0.25;0.9;0.25" dur="2.6s" repeatCount="indefinite"/></rect>
    <g clip-path="url(#cp)"><rect x="-80" y="0" width="46" height="64" fill="#ffffff" fill-opacity="0.32" transform="skewX(-20)"><animate attributeName="x" values="-80;300;300" keyTimes="0;0.45;1" dur="3.6s" repeatCount="indefinite"/></rect></g>
    <text x="120" y="39" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="21" font-weight="800" fill="#ffffff">🌐  Portfolio</text>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="3s" repeatCount="indefinite"/>
  </g>
</svg>
