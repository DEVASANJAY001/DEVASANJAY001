<svg xmlns="http://www.w3.org/2000/svg" width="580" height="240" viewBox="0 0 580 240" role="img" aria-label="AI Fertilizer Engine">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f0c29"/><stop offset="0.6" stop-color="#1b1464"/><stop offset="1" stop-color="#24243e"/></linearGradient>
    <linearGradient id="rb" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="290" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#00f5ff"/><stop offset="0.33" stop-color="#7c3aed"/><stop offset="0.66" stop-color="#ff5ecb"/><stop offset="1" stop-color="#ffb347"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="580 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect x="3" y="3" width="574" height="234" rx="20" fill="url(#bg)"/>
  <rect x="3" y="3" width="574" height="234" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
  <rect x="3" y="3" width="574" height="234" rx="20" fill="none" stroke="url(#rb)" stroke-width="3.5" stroke-linecap="round" pathLength="1000" stroke-dasharray="220 780"><animate attributeName="stroke-dashoffset" from="0" to="-1000" dur="6s" repeatCount="indefinite"/></rect>
  <g><text x="62" y="92" text-anchor="middle" font-size="52">🌾</text><animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="3.4s" repeatCount="indefinite"/></g>
  <text x="112" y="70" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="25" font-weight="800" fill="#ffffff">AI Fertilizer Engine</text>
  <text x="112" y="96" font-family="'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace" font-size="13" fill="#00f5ff">AgriTech ML · Tamil Nadu hackathon</text>
  <text x="34" y="144" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="16" fill="#cbd5e1">Designed to recommend NPK ratios per</text>
  <text x="34" y="168" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="16" fill="#cbd5e1">district, crop and season (XGBoost).</text>
  <g><rect x="34" y="186" width="75" height="28" rx="14" fill="#3776AB" fill-opacity="0.18" stroke="#3776AB" stroke-width="1.5"/><text x="71.5" y="205" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#ffffff">Python</text><animate attributeName="opacity" values="0.8;1;0.8" dur="2.5s" repeatCount="indefinite"/></g>
    <g><rect x="119" y="186" width="83" height="28" rx="14" fill="#EC6C00" fill-opacity="0.18" stroke="#EC6C00" stroke-width="1.5"/><text x="160.5" y="205" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#ffffff">XGBoost</text><animate attributeName="opacity" values="0.8;1;0.8" dur="3.0s" repeatCount="indefinite"/></g>
    <g><rect x="212" y="186" width="92" height="28" rx="14" fill="#4ade80" fill-opacity="0.18" stroke="#4ade80" stroke-width="1.5"/><text x="258.0" y="205" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#ffffff">AgriTech</text><animate attributeName="opacity" values="0.8;1;0.8" dur="3.5s" repeatCount="indefinite"/></g>
    
  <g transform="translate(419 18)">
    <rect width="141" height="26" rx="13" fill="#ffb347" fill-opacity="0.2" stroke="#ffb347" stroke-width="1.5"/>
    <circle cx="14" cy="13" r="4" fill="#ffb347"><animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/></circle>
    <text x="79.5" y="18" text-anchor="middle" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-size="11.5" font-weight="800" fill="#ffffff" letter-spacing="1">IN PROGRESS</text>
  </g>
</svg>
